[supervisord]
nodaemon=true
logfile=/var/www/storage/logs/supervisord.log
pidfile=/var/www/supervisord.pid
user=www-data

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/php-fpm.log
stderr_logfile=/var/www/storage/logs/php-fpm.err.log

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/www/storage/logs/nginx.log
stderr_logfile=/var/www/storage/logs/nginx.err.log

[program:laravel-scheduler]
command=/usr/local/bin/php /var/www/artisan schedule:run
directory=/var/www
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/www/storage/logs/scheduler.log

[program:laravel-queue]
command=/usr/local/bin/php /var/www/artisan queue:work database --sleep=3 --tries=3
directory=/var/www
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/storage/logs/queue-worker-%(process_num)02d.log
